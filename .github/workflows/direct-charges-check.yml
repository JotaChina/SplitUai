name: Validate direct charges
on:
  push:
    branches: [feat/direct-charges]
  pull_request:
    paths:
      - 'src/components/DirectCharges.tsx'
      - 'src/lib/directCharges.ts'
      - 'scripts/direct-charges*'
      - 'supabase/migrations/20261118000200_direct_charges.sql'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: SplitUai
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: charges_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/direct-charges.test.mjs
      - run: node --test scripts/deploy-direct-charges.test.mjs
        env:
          DIRECT_CHARGES_TEST_SQL_PATH: ${{ runner.temp }}/direct-charges-transaction.sql
      - name: PostgreSQL authorization and lifecycle tests
        env:
          PGPASSWORD: local-test-only
        run: |
          psql -h localhost -U postgres -d charges_ci -v ON_ERROR_STOP=1 -f scripts/direct-charges-fixture.sql
          psql -h localhost -U postgres -d charges_ci -v ON_ERROR_STOP=1 -f supabase/migrations/20261118000200_direct_charges.sql
          psql -h localhost -U postgres -d charges_ci -v ON_ERROR_STOP=1 -f scripts/direct-charges-security.sql
          createdb -h localhost -U postgres charges_deploy_ci
          psql -h localhost -U postgres -d charges_deploy_ci -v ON_ERROR_STOP=1 -f scripts/direct-charges-fixture.sql
          psql -h localhost -U postgres -d charges_deploy_ci -v ON_ERROR_STOP=1 -c 'create schema supabase_migrations; create table supabase_migrations.schema_migrations(version text primary key,name text,statements text[]);'
          psql -h localhost -U postgres -d charges_deploy_ci -v ON_ERROR_STOP=1 -f "${{ runner.temp }}/direct-charges-transaction.sql"
          psql -h localhost -U postgres -d charges_deploy_ci -v ON_ERROR_STOP=1 -f "${{ runner.temp }}/direct-charges-transaction.sql"
          psql -h localhost -U postgres -d charges_deploy_ci -v ON_ERROR_STOP=1 -c "do \$\$ begin if (select count(*) from supabase_migrations.schema_migrations where version='20261118000200')<>1 then raise exception 'Migration ledger mismatch'; end if; end \$\$;"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
  verify-credential:
    name: Verify Supabase credential (read only)
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/direct-charges'
    runs-on: ubuntu-latest
    environment: SplitUai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test scoped credential without applying migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: node scripts/deploy-direct-charges.mjs --check
